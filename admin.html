<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Parcial - Admin Log In</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div><strong>Parcero</strong></div>
            <ul class="nav-links">
                <li><a href="index.html">Noticias</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="sign.html">Sign Up</a></li>
                <li class="dropdown">
                    <a href="#" class="dropbtn">About ▾</a>
                    <div class="dropdown-content">
                        <a href="about.html?tab=mision">Misión</a>
                        <a href="about.html?tab=vision">Visión</a>
                        <a href="about.html?tab=equipo">Equipo de Trabajo</a>
                    </div>
                </li>
            </ul>
            <div class="search-box">
                <input type="text" id="globalSearchInput" placeholder="Search...">
                <button type="button" onclick="executeGlobalSearch()">Search</button>
            </div>
        </nav>
    </header>

    <div class="container" style="max-width: 500px;">
        <h2>Por favor ingrese sus credenciales para acceder al sistema</h2><br>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Clave</label>
                <input type="password" id="password" required>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-secondary">Log In</button>
                <button type="button" class="btn btn-secondary" onclick="location.href='sign.html'">Sign Up</button>
                <button type="button" class="btn btn-secondary" onclick="location.href='index.html'">Cancelar</button>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; Parcero | 2026 | Alejandro Saenz</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
