<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Parcial - Registro</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div><strong>Parcero</strong></div>
            <ul class="nav-links">
                <li><a href="index.html">Noticias</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="sign.html">Sign Up</a></li>
                <li class="dropdown">
                    <a href="#" class="dropbtn">About ▾</a>
                    <div class="dropdown-content">
                        <a href="about.html?tab=mision">Misión</a>
                        <a href="about.html?tab=vision">Visión</a>
                        <a href="about.html?tab=equipo">Equipo de Trabajo</a>
                    </div>
                </li>
            </ul>
            <div class="search-box">
                <input type="text" id="globalSearchInput" placeholder="Search...">
                <button type="button" onclick="executeGlobalSearch()">Search</button>
            </div>
        </nav>
    </header>
    <div class="container" style="max-width: 650px;">
        <h2 style="text-align: center;">Ingrese los datos para registrarse</h2><br>
        <form id="signupForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombres</label>
                    <input type="text" id="regNombres" required pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]{3,30}$">
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" id="regApellidos" required pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]{3,30}$">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="regTelefono" required pattern="^\d{7,10}$">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Estrato</label>
                    <input type="number" id="regEstrato" min="1" max="6" required>
                </div>
                <div class="form-group">
                    <label>Fecha Nacimiento</label>
                    <input type="date" id="regFecha" required>
                </div>
                <div class="form-group">
                    <label>Grupo Sanguíneo</label>
                    <select id="regSangre" required>
                        <option value="">Select</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="A+">A+</option>
                        <option value="B+">B+</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Género</label>
                <input type="radio" name="genero" value="Masculino" required style="width:auto;"> Masculino &nbsp;&nbsp;
                <input type="radio" name="genero" value="Femenino" style="width:auto;"> Femenino
            </div>

            <div class="form-group">
                <label>Actividades Favoritas</label>
                <input type="checkbox" name="actividades" value="Fútbol" style="width:auto;"> Fútbol <br>
                <input type="checkbox" name="actividades" value="Baloncesto" style="width:auto;"> Baloncesto <br>
                <input type="checkbox" name="actividades" value="Voleibol" style="width:auto;"> Voleibol <br>
                <input type="checkbox" name="actividades" value="Ciclismo" style="width:auto;"> Ciclismo
            </div>

            <div class="btn-group" style="justify-content: center;">
                <button type="submit" class="btn btn-success">Registrar</button>
                <button type="button" class="btn btn-danger" onclick="location.href='admin.html'">Cancelar</button>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; Parcero | 2026 | Alejandro Saenz</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
